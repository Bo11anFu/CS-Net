model:
  network:
    name: DCPNet
    num_inputs: 5
    num_classes: 1
    in_channels: 3
    num_blocks: [2, 2, 2, 2]
    nb_filter: [8, 16, 32, 64, 128]
    num_stages: 4
  optimizer:
    type: AdamW
    init_lr: !!float 1e-4
    betas: [0.9, 0.999]
    weight_decay: !!float 1e-4
  lr_scheduler:
    warmup_iters: -1
    scheduler:
      type: MultiStepLR
      step_interval: epoch
      milestones: [32, 44]
      gamma: 0.1

  loss:
    num_preds: 1
    loss_1:
      type: SoftIoULoss
      weight: 1
      smooth: 1
      reduction: mean


dataset:
  name: MIST
  root: /home/ubuntu/data/zhengqinxu/object_detection/DATA/MIST_0912/MIST_0912
  num_inputs: 5
  img_size: [384, 384]
  frame_padding: False
  data_aug:
    random_flip: True
    random_crop: True
    random_rotation: True
    color_enhance: False
    random_peper: False

train:
  exp_name: DCPNet_MIST
  batch_size: 12
  num_workers: 16
  total_epochs: 50
  log_interval: 50
  save_interval: 1
  val_interval: 1
  resume:
