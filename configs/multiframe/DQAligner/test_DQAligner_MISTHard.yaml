model:
  network:
    name: DQAligner
    input_channels: 3  # MISTDataset in train_loss1.py returns RGB frames: [B, 3, T, H, W]
    num_frames: 5
    train_mode: False
    key_mode: last
    
dataset:
  name: MIST  # [MIST, NUDT-MIRSDT]
  root: /home/ubuntu/data/zhengqinxu/object_detection/DATA/MIST_0912/MIST_0912  # data root path
  num_inputs: 5  # number of input frames
  img_size: [ 384, 384 ]  # image size
  frame_padding: False
  data_aug: # data augmentation options
    random_flip: True
    random_crop: True
    random_rotation: True
    color_enhance: False
    random_peper: False

test:
  exp_root: /home/ubuntu/data/zhengqinxu/object_detection/Deep-MIST/results/DQAligner_MIST_0626/20260709_223023
  num_workers: 16  # number of data loading workers
  checkpoint: /home/ubuntu/data/zhengqinxu/object_detection/Deep-MIST/results/DQAligner_MIST_0626/20260709_223023/checkpoints/model_epoch_22.pth