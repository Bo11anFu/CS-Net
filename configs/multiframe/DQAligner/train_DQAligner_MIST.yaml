model:
  network:
    name: DQAligner
    input_channels: 3  # MISTDataset in train_loss1.py returns RGB frames: [B, 3, T, H, W]
    num_frames: 5
    train_mode: False
    key_mode: last
  optimizer:
    type: Adam
    init_lr: !!float 5e-4
    betas: [ 0.9, 0.999 ]
  lr_scheduler:
    warmup_iters: -1
    scheduler:
      type: StepLR
      step_interval: epoch
      step_size: 5
      gamma: 0.2
      # train_loss1.py does not expose the original script's lr floor clamp at 1e-5.
  loss:
    num_preds: 1
    loss_1:
      type: AdaFocalLoss
      weight: 1

dataset:
  name: MIST
  root: /home/ubuntu/data/zhengqinxu/object_detection/DATA/MIST_0912/MIST_0912
  num_inputs: 5
  img_size: [ 512, 512 ]
  frame_padding: False
  data_aug:
    random_flip: True
    random_crop: True
    random_rotation: True
    color_enhance: False
    random_peper: False

train:
  exp_name: DQAligner_MIST_0626
  batch_size: 1
  num_workers: 16
  total_epochs: 30
  log_interval: 50
  save_interval: 1
  val_interval: 1
  resume:
