model:
  network:
    name: TSINet
    num_frames: 5
    in_channels: 3
  optimizer:
    type: Adam  # [SGD, Adam, AdamW, Adagrad]
    init_lr: !!float 5e-3  # initial learning rate
    betas: [ 0.9, 0.999 ]
  lr_scheduler:
    warmup_iters: -1  # number of warmup iters (-1 for no warmup)
    scheduler:
      type: CosineAnnealingLR  # [LambdaLR, StepLR, MultiStepLR, CosineAnnealingLR]
      step_interval: iter  # iter or epoch (every iter or every epoch to update once)
      eta_min: !!float 1e-6
  loss:
    num_preds: 1  # number of predicted masks (default 1, when using deep supervision > 1)
    loss_1:
      type: MTWHLoss
      weight: 1
      threshold: 0.4

dataset:
  name: NUDT-MIRSDT  # [MIST, NUDT-MIRSDT]
  root: /home/ubuntu/data/zhengqinxu/object_detection/Deep-MIST/data/NUDT-MIRSDT  # data root path
  full_supervision: True

train:
  exp_name: TSINet_MTWHLoss_NUDTMIRSDT  # experiment name (as well as the root for saving results)
  batch_size: 2  # total batch size of all gpus
  num_workers: 16  # number of data loading workers
  total_epochs: 200  # number of total epochs to run
  log_interval: 50  # default 50 iters
  save_interval: 1  # default 1 epoch
  val_interval: 1  # default 1 epoch
  resume:
