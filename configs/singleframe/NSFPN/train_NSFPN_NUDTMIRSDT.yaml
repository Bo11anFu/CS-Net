model:
  network:
    name: NSFPN
    input_channels: 3
  optimizer:
    type: Adagrad
    init_lr: !!float 1e-4
    lr_decay: 0
    weight_decay: !!float 1e-4
  lr_scheduler:
    warmup_iters: -1
    scheduler:
      type: MultiStepLR
      step_interval: epoch
      milestones: [150, 300, 400]
      gamma: 0.1
  loss:
    num_preds: 5
    loss_1:
      type: SLSIoULoss
      weight: 1
      warm_epoch: 5
      with_shape: True

dataset:
  name: NUDT-MIRSDT
  root: /home/ubuntu/data/zhengqinxu/object_detection/Deep-MIST/data/NUDT-MIRSDT
  full_supervision: True

train:
  exp_name: NSFPN_SLSIoULoss_NUDTMIRSDT
  batch_size: 16
  num_workers: 16
  total_epochs: 500
  log_interval: 50
  save_interval: 1
  val_interval: 1
  resume: