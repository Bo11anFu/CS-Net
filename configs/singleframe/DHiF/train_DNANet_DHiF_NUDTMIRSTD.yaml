model:
  network:
    name: DNANet_DHiF
    input_channels: 3
    deep_supervision: True
  optimizer:
    type: Adam
    init_lr: !!float 1e-3
  lr_scheduler:
    warmup_iters: -1
    scheduler:
      type: MultiStepLR
      step_interval: epoch
      milestones: [ 100, 150, 200, 250, 300, 350, 400, 450, 500 ]
      gamma: 0.5
  loss:
    num_preds: 4
    loss_1:
      type: SoftIoULoss
      weight: [ 0.25, 0.25, 0.25, 0.25 ]
      smooth: 1
      reduction: mean

dataset:
  name: NUDT-MIRSDT
  root: /home/ubuntu/data/zhengqinxu/object_detection/Deep-MIST/data/NUDT-MIRSDT
  full_supervision: True

train:
  exp_name: DNANet_DHiF_NUDTMIRSTD_0708
  batch_size: 2
  num_workers: 16
  total_epochs: 150
  log_interval: 50
  save_interval: 1
  val_interval: 1
  resume:
