model:
  network:
    name: MSHNet
    use_pconv: True
  optimizer:
    type: AdamW  # AdamW Adam
    init_lr: !!float 5e-4  # initial learning rate  1e-3  5e-4
    betas: [ 0.9, 0.999 ]
    weight_decay: !!float 1e-4
  lr_scheduler:
    warmup_iters: -1  # number of warmup iters (-1 for no warmup)
    scheduler:
      type: MultiStepLR  # [LambdaLR, StepLR, MultiStepLR, CosineAnnealingLR]
      step_interval: epoch  # iter or epoch (every iter or every epoch to update once)
      milestones: [ 32, 44 ]  # [ 24, 33 ]  [ 32, 44 ]
      gamma: 0.1
#    scheduler:
#      type: StepLR  # [LambdaLR, StepLR, MultiStepLR, CosineAnnealingLR]
#      step_interval: epoch  # iter or epoch (every iter or every epoch to update once)
#      step_size: 10  # 5, 10
#      gamma: 0.5
  loss:
    num_preds: 5  # number of predicted masks (default 1, when using deep supervision > 1)
    loss_1:
      type: SDMLoss
      weight: 1
      warm_epoch: 5
      with_shape: True
      with_distance: True
      dynamic: True
      delta: 0.5
#    loss_1:
#      type: SoftIoULoss
#      weight: 1
#      smooth: 1
#      reduction: mean

dataset:
  name: SatVideoIRSTD  # [MIST, NUDT-MIRSDT]
#  root: ./data/SatVideoIRSTD  # 新新八卡
#  root: /home/ubuntu/mysda/zhengqinxu/dark_object_detection/DATA/IRAir  # A100
#  root: /home/ubuntu/mysda2-llq/zhengqinxu/small_object_detection/DATA/IRAir  # A800
  root: /home/ubuntu/data/zhengqinxu/object_detection/DATA/IRAir  # L20
  num_inputs: 5  # number of input frames
  img_size: [ 256, 256 ]  # image size
  frame_padding: False
  data_aug: # data augmentation options
    random_flip: True
    random_crop: True
    random_rotation: True
    color_enhance: False
    random_peper: False

train:
  exp_name: MSHNet_PConv_SDLoss_SatVideoIRSTD  # experiment name (as well as the root for saving results)
  batch_size: 32  # total batch size of all gpus, 12, 16
  num_workers: 16  # number of data loading workers
  total_epochs: 48  # number of total epochs to run, 48, 50
  log_interval: 50  # default 50 iters
  save_interval: 1  # default 1 epoch
  val_interval: 1  # default 1 epoch
  resume: